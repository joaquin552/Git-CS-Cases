<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BoxCS2 - Panel de Usuarios</title>

    <style>
        :root {
            --panel-bg: rgba(18, 22, 31, 0.75);
            --neon-gold: #f5b041;
            --neon-red: #ec7063;
            --neon-blue: #5dade2;
            --text-color: #f2f4f4;
            --border-glow: rgba(245, 176, 65, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #4fa8e2 0%,
                #1a2536 100%
            );
            color: var(--text-color);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .crud-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 2px solid #242b3d;
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(12px);
            box-shadow:
                0 10px 30px rgba(0,0,0,0.5),
                0 0 40px var(--border-glow);
        }

        .hud-header {
            border-bottom: 2px dashed #242b3d;
            padding-bottom: 20px;
            margin-bottom: 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-header h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-gold);
        }

        .connection {
            color: #52be80;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        th {
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 15px;
            color: #85929e;
            text-align: left;
        }

        tr.user-row {
            background: rgba(25, 32, 48, 0.5);
        }

        tr.user-row:hover {
            background: rgba(36, 43, 61, 0.8);
        }

        td {
            padding: 15px;
            border-top: 1px solid #242b3d;
            border-bottom: 1px solid #242b3d;
        }

        td:first-child {
            border-left: 1px solid #242b3d;
            border-radius: 6px 0 0 6px;
            color: var(--neon-gold);
            font-weight: bold;
        }

        td:last-child {
            border-right: 1px solid #242b3d;
            border-radius: 0 6px 6px 0;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-edit {
            background: var(--neon-blue);
            color: #111;
            margin-right: 8px;
        }

        .btn-edit:hover {
            background: #3498db;
        }

        .btn-delete {
            background: var(--neon-red);
            color: white;
        }

        .btn-delete:hover {
            background: #ec4f3e;
        }

        /* MODAL */

        .modal-overlay {
            display: none;

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(4, 5, 7, 0.85);

            z-index: 100;
        }

        .modal-box {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: #12161f;

            border: 2px solid var(--neon-gold);

            border-radius: 10px;

            padding: 30px;

            width: 90%;
            max-width: 450px;
        }

        .modal-box h2 {
            color: var(--neon-gold);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            font-size: 0.85rem;

            color: #85929e;

            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            background: #1c2230;

            border: 1px solid #34495e;

            border-radius: 5px;

            color: white;

            font-size: 1rem;
        }

        .modal-footer {
            display: flex;

            justify-content: flex-end;

            margin-top: 20px;

            gap: 10px;
        }

        .btn-close {
            background: #566573;
            color: white;
        }
    </style>
</head>

<body>

    <div class="crud-container">

        <div class="hud-header">

            <h1>Panel de Control Operacional</h1>

            <span class="connection">
                ● CONEXIÓN ACTIVE_BD
            </span>

        </div>

        <div class="table-responsive">

            <table>

                <thead>

                    <tr>
                        <th>UID</th>
                        <th>Agente / Usuario</th>
                        <th>Dirección Email</th>
                        <th style="text-align: right;">
                            Acciones
                        </th>
                    </tr>

                </thead>

                <tbody id="tabla-usuarios">

                    <!-- Los usuarios aparecerán acá -->

                </tbody>

            </table>

        </div>

    </div>


    <!-- MODAL PARA EDITAR -->

    <div id="modalOverlay" class="modal-overlay">

        <div class="modal-box">

            <h2>Modificar Perfil</h2>

            <form id="formEditar">

                <input
                    type="hidden"
                    id="edit-id"
                >

                <div class="form-group">

                    <label>
                        Nombre de Usuario
                    </label>

                    <input
                        type="text"
                        id="edit-username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Correo Electrónico
                    </label>

                    <input
                        type="email"
                        id="edit-email"
                        required
                    >

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-close"
                        onclick="cerrarModal()"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn btn-edit"
                    >
                        Actualizar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script>

        // ==========================
        // READ
        // ==========================

        async function obtenerAgentes() {

            try {

                const respuesta = await fetch("/api/usuarios");

                if (!respuesta.ok) {
                    throw new Error("Error al obtener usuarios");
                }

                const agentes = await respuesta.json();

                const tbody =
                    document.getElementById("tabla-usuarios");

                tbody.innerHTML = "";

                agentes.forEach(agente => {

                    tbody.innerHTML += `

                        <tr class="user-row">

                            <td>
                                #00${agente.id}
                            </td>

                            <td style="font-weight: bold;">
                                ${agente.username}
                            </td>

                            <td>
                                ${agente.email}
                            </td>

                            <td style="text-align: right;">

                                <button
                                    class="btn btn-edit"
                                    onclick="desplegarEditor(${agente.id})"
                                >
                                    Editar
                                </button>

                                <button
                                    class="btn btn-delete"
                                    onclick="eliminarAgente(${agente.id})"
                                >
                                    Eliminar
                                </button>

                            </td>

                        </tr>

                    `;

                });

            } catch (error) {

                console.error(
                    "Error al cargar usuarios:",
                    error
                );

            }

        }


        // ==========================
        // ABRIR MODAL
        // ==========================

        async function desplegarEditor(id) {

            try {

                const respuesta =
                    await fetch(`/api/usuarios/${id}`);

                if (!respuesta.ok) {

                    throw new Error(
                        "No se pudo obtener el usuario"
                    );

                }

                const agente =
                    await respuesta.json();

                document.getElementById("edit-id").value =
                    agente.id;

                document.getElementById("edit-username").value =
                    agente.username;

                document.getElementById("edit-email").value =
                    agente.email;

                document.getElementById("modalOverlay").style.display =
                    "block";

            } catch (error) {

                console.error(error);

                alert("No se pudo cargar el usuario.");

            }

        }


        // ==========================
        // CERRAR MODAL
        // ==========================

        function cerrarModal() {

            document.getElementById("modalOverlay").style.display =
                "none";

        }


        // ==========================
        // UPDATE
        // ==========================

        document
            .getElementById("formEditar")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const id =
                    document.getElementById("edit-id").value;

                const username =
                    document.getElementById("edit-username").value;

                const email =
                    document.getElementById("edit-email").value;


                try {

                    const respuesta = await fetch(
                        `/api/usuarios/${id}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                email: email
                            })
                        }
                    );


                    const datos =
                        await respuesta.json();


                    if (!respuesta.ok) {

                        throw new Error(
                            datos.mensaje ||
                            "Error al actualizar"
                        );

                    }


                    alert(datos.mensaje);

                    cerrarModal();

                    obtenerAgentes();


                } catch (error) {

                    console.error(error);

                    alert(
                        "No se pudo actualizar el usuario."
                    );

                }

            });


        // ==========================
        // DELETE
        // ==========================

        async function eliminarAgente(id) {

            const confirmar =
                confirm(
                    "¿Seguro que querés eliminar este usuario?"
                );

            if (!confirmar) {
                return;
            }


            try {

                const respuesta =
                    await fetch(
                        `/api/usuarios/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                const datos =
                    await respuesta.json();


                if (!respuesta.ok) {

                    throw new Error(
                        datos.mensaje ||
                        "Error al eliminar"
                    );

                }


                alert(datos.mensaje);

                obtenerAgentes();


            } catch (error) {

                console.error(error);

                alert(
                    "No se pudo eliminar el usuario."
                );

            }

        }


        // ==========================
        // CARGAR USUARIOS AL ABRIR
        // ==========================

        obtenerAgentes();

    </script>

</body>
</html>
